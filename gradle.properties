org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 can compile Kotlin itself, but that built-in mode does not put the Kotlin
# output on the Java compile classpath, so the data binding generated classes
# (which reference the Kotlin MainViewModel) fail to resolve. The Kotlin Gradle
# plugin plus kapt keeps data binding working.
android.builtInKotlin=false

# The Kotlin Gradle plugin does not support AGP 9's new DSL yet, so the legacy DSL
# is used instead. Remove this once Kotlin supports `android.newDsl=true`.
android.newDsl=false

# Namespacing of each library's R class so that its R class only includes the
# resources declared in the library itself.
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
