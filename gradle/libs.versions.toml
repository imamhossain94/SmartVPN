[versions]
# Build tooling
agp = "9.1.0"
kotlin = "2.4.20"
# Pinned so a transitive dependency cannot drag in a stdlib whose metadata the
# Kotlin compiler cannot read.
kotlinStdlib = "2.4.20"

# Android SDK levels
minSdk = "23"
compileSdk = "36"
targetSdk = "36"

# AndroidX / Material
# androidx.core is held at 1.17.0: 1.19.x requires compileSdk 37.
androidxCore = "1.17.0"
appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
splashscreen = "1.2.0"
localbroadcastmanager = "1.1.0"
swiperefreshlayout = "1.2.0"

# Architecture components
# lifecycle is held at 2.10.0: 2.11.0 pulls in a Compose artifact that requires
# compileSdk 37.
lifecycle = "2.10.0"
coroutines = "1.11.0"

# DI
koin = "4.2.2"

# Networking / serialization
# okhttp is held at 5.3.2: 5.4.0+ requires compileSdk 37.
okhttp = "5.3.2"
gson = "2.14.0"
kotlinCsv = "1.10.0"

# UI helpers
titleBar = "10.8"
# balloon is held at 1.7.x: 2.x is a full API rewrite of Balloon.Builder /
# Balloon.Factory, and 1.7.6 is the last release that keeps the 1.x surface.
balloon = "1.7.6"
# glide is held at 5.0.7: 5.0.9 requires compileSdk 37.
glide = "5.0.7"
shimmer = "0.5.0"
recyclerViewAnimators = "4.0.2"
bindables = "1.0.9"
timber = "5.0.1"

# Test
junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"
archCoreTesting = "2.2.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinStdlib" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "localbroadcastmanager" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
material = { module = "com.google.android.material:material", version.ref = "material" }

androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
kotlin-csv = { module = "com.github.doyaaaaaken:kotlin-csv-jvm", version.ref = "kotlinCsv" }

titlebar = { module = "com.github.getActivity:TitleBar", version.ref = "titleBar" }
balloon = { module = "com.github.skydoves:balloon", version.ref = "balloon" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
shimmer = { module = "com.facebook.shimmer:shimmer", version.ref = "shimmer" }
recyclerview-animators = { module = "jp.wasabeef:recyclerview-animators", version.ref = "recyclerViewAnimators" }
bindables = { module = "com.github.skydoves:bindables", version.ref = "bindables" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit-ktx", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "archCoreTesting" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
